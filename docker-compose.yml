services:
  db:
    image: postgres:13.6
    container_name: ninjas_db_container
    environment:
      POSTGRES_DB: ninjas_db
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5433:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
    pgdata:
